name: nightly

# Everything the PR gate must stay fast enough to skip (docs/design/testing.md §8): the slow and
# GUI groups, coverage, dependency audit, and later fuzz / criterion / mutation runs.
#
# The `live` group never runs here: it needs real provider credentials and stays a manual,
# self-hosted run (`cargo nextest run --profile live`).
on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  INSTA_UPDATE: "no"
  NEXTEST_VERSION: 0.9.146

jobs:
  nightly:
    name: nightly (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: |
            cargo-nextest@${{ env.NEXTEST_VERSION }}
            cargo-audit
            cargo-llvm-cov

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: gate-linux

      # Run the PR gate first so a nightly-only failure is unambiguously attributable to the
      # extra groups below.
      - name: PR gate
        run: bash scripts/ci.sh

      # --no-tests=warn: an empty group is expected early in a milestone and must not fail the
      # run, but it should stay visible in the log.
      - name: Slow group
        run: cargo nextest run --workspace --profile slow --no-tests=warn

      - name: GUI group
        run: cargo nextest run --workspace --profile gui --no-tests=warn

      - name: Dependency audit
        run: cargo audit

      - name: Coverage report
        run: cargo xtask coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: target/llvm-cov/html
          if-no-files-found: warn

      # TODO(M1): cargo-fuzz short runs, 10min per target (docs/design/testing.md §6)
      # TODO(M2+): criterion baseline comparison, flag >20% regressions (§7)
      # TODO(M2+): cargo-mutants limited to hatchery-store and hatchery-kernel (§8)
      # TODO(M4): run the gui group inside a GNOME SDK container with xvfb-run (§3.9)
