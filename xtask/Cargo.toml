[package]
name = "xtask"
description = "Developer tasks for the hatchery workspace: layering contract, coverage, i18n extraction, fixture recording"
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# The recorder captures raw SSE bytes, which the product wire layer deliberately never exposes;
# it therefore speaks HTTP itself. Same TLS story as the product crates: no bundled backend,
# ferritls installed explicitly, so feature unification cannot quietly change anyone's crypto.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
ferritls-rustls = { version = "0.8", default-features = false }

[lints]
workspace = true
