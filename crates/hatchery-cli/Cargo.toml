[package]
name = "hatchery-cli"
description = "Terminal frontend: ratatui TUI and headless exec, both as thin protocol clients"
keywords = ["agent", "cli", "tui", "hatchery"]
categories = ["command-line-utilities"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
name = "hatchery_cli"
path = "src/lib.rs"

[[bin]]
name = "hatchery"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
crossterm.workspace = true
futures.workspace = true
hatchery-daemon.workspace = true
hatchery-protocol.workspace = true
minimad.workspace = true
ratatui.workspace = true
unicode-width.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "signal"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
hatchery-testkit.workspace = true
tempfile.workspace = true
toml.workspace = true

[lints]
workspace = true
