[package]
name = "hatchery-tests"
description = "Cross-crate e2e scenarios and the core-invariant suite (docs/design/testing.md §4–§5); never published"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# Everything lives in one table on purpose: the bin target below is built from
# [dependencies] anyway, and the integration tests may read from either.
[dependencies]
hatchery-daemon.workspace = true
hatchery-protocol.workspace = true
hatchery-store.workspace = true
hatchery-testkit.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
toml.workspace = true

[[bin]]
name = "e2e_daemon"
path = "src/bin/e2e_daemon.rs"

[lints]
workspace = true
