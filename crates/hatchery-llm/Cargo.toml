[package]
name = "hatchery-llm"
description = "LLM provider adapters built on openai-interface: Chat Completions and Responses wires, reasoning passback"
keywords = ["llm", "openai", "reasoning", "streaming", "hatchery"]
categories = ["api-bindings"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
async-trait.workspace = true
futures.workspace = true
hatchery-kernel.workspace = true
hatchery-protocol.workspace = true
openai-interface.workspace = true
# Only for the `Client`/header types the adapter's public surface hands around; the crate is a
# transitive dependency of openai-interface either way.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
hatchery-testkit.workspace = true
# test-util brings `start_paused`, which the backoff-timing tests need (testing.md §3.3).
tokio = { workspace = true, features = ["test-util"] }

[features]
# Live tests hit a real provider and need credentials; they never run in CI (testing.md §8).
live-tests = []

[lints]
workspace = true
