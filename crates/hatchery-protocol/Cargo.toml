[package]
name = "hatchery-protocol"
description = "Wire protocol and data model of the hatchery daemon: sessions, items, JSON-RPC methods and server events"
keywords = ["agent", "protocol", "json-rpc", "hatchery"]
categories = ["data-structures"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

# ADR-0013: `transport` is the only module that names a socket type, and it names a different one
# per platform — tokio's `net::unix` is gated behind `cfg(unix)`, so `net` is useless (and
# interprocess is dead weight) on the other half of the pair.
[target.'cfg(unix)'.dependencies]
tokio = { workspace = true, features = ["net"] }

[target.'cfg(windows)'.dependencies]
interprocess = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
